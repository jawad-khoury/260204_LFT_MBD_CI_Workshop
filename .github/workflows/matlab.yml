# This workflow was generated using the GitHub Actions Workflow Generator for MATLAB.
# See https://matlab-actions.github.io/workflow-generator

name: MATLAB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  
jobs:
  Restore_Cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository

        uses: actions/checkout@v4

      - name: Restore Cache

        uses: actions/cache@v4

        with:
          key: padv_artifacts-${{ github.run_id }}-${{ github.run_attempt }}

          restore-keys: padv_artifacts-cache

          path:
            |
            PA_Results/dcmtrCtrl_PID/webview
            PA_Results/dcmtr_testharness/webview
            PA_Results/test_results
            derived/artifacts.dmr


      - name: Upload Artifacts

        if:
          ${{ !cancelled() }}

        uses: actions/upload-artifact@v4

        with:
          name: Restore_Cache_padv_artifacts

          path:
            |
            derived/artifacts.dmr
            PA_Results/dcmtrCtrl_PID/webview
            PA_Results/dcmtr_testharness/webview
            PA_Results/test_results

          retention-days:
            30


  Runprocess:
    if:
      ${{ !cancelled() }}

    needs: Restore_Cache

    runs-on: ubuntu-latest

    env:
      # To use a batch token in this workflow, first create an MLM_LICENSE_TOKEN secret in your repository settings.
      # See https://github.com/matlab-actions/setup-matlab/#use-matlab-batch-licensing-token
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: printenv
        run: printenv
      - name: Checkout Repository

        uses: actions/checkout@v4

      - name: Download Artifacts

        uses: actions/download-artifact@v4

        with:
          name: Restore_Cache_padv_artifacts

        # Set up MATLAB and other MathWorks products on the runner.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          # Set up additional products using the products input.
          # See https://github.com/matlab-actions/setup-matlab/#set-up-matlab
          products: |
            MATLAB
            Simulink
            Stateflow
            Control_System_Toolbox
            MATLAB_Coder
            Simulink_Coder
            Embedded_Coder
            Simulink_Check
            Simulink_Coverage
            Simulink_Test
            Simscape
            Simscape_Electrical
            Parallel_Computing_Toolbox
            MATLAB_Report_Generator
            Simulink_Report_Generator
            CI/CD_Automation_for_Simulink_Check

      - uses: matlab-actions/setup-matlab@v2

      - name: Debug MLM_LICENSE_TOKEN
        run: |
          if [ -z "$MLM_LICENSE_TOKEN" ]; then
            echo "MLM_LICENSE_TOKEN is not set!"
            exit 1
          else
            echo "MLM_LICENSE_TOKEN is set, length: ${#MLM_LICENSE_TOKEN}"
            echo "${MLM_LICENSE_TOKEN:0:5}*****"
          fi

      - name: Launch MATLAB

        run:
          >
          matlab-batch 
          -logfile output.log 
          "openProject(pwd);runprocess(Process = 'CIPipeline', Force = false, ExitInBatchMode = true, RerunFailedTasks = false, RerunErroredTasks = false, GenerateJUnitForProcess = false);" 

      - name: Upload Artifacts

        if:
          ${{ !cancelled() }}

        uses:
          actions/upload-artifact@v4

        with:
          name: Runprocess_padv_artifacts

          path:
            |
            derived/artifacts.dmr
            PA_Results/dcmtrCtrl_PID/webview
            PA_Results/dcmtr_testharness/webview
            PA_Results/test_results

          retention-days:
            30


  Generate_PADV_Report:
    if:
      ${{ !cancelled() }}

    needs: Runprocess

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository

        uses: actions/checkout@v4

      - name: Download Artifacts

        uses: actions/download-artifact@v4

        with:
          name: Restore_Cache_padv_artifacts

      - name: Download Artifacts

        uses: actions/download-artifact@v4

        with:
          name: Runprocess_padv_artifacts

      - uses: matlab-actions/setup-matlab@v2

      - name: Generate PADV Report

        run:
          >
          matlab-batch 
          -logfile output.log 
          "openProject(pwd);
          rptObj=padv.ProcessAdvisorReportGenerator(Process = 'CIPipeline', Format='pdf', OutputPath=fullfile(currentProject().RootFolder,'ProcessAdvisorReport'));
          rptObj.generateReport();" 

      - name: Upload Artifacts

        if:
          ${{ !cancelled() }}

        uses: actions/upload-artifact@v4

        with:
          name: Generate_PADV_Report_padv_artifacts

          path:
            |
            derived/artifacts.dmr
            ProcessAdvisorReport.pdf

          retention-days:
            30


  Collect_Artifacts:
    if:
      ${{ !cancelled() }}

    needs: Generate_PADV_Report

    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts

        uses: actions/download-artifact@v4

        with:
          name: Restore_Cache_padv_artifacts


      - name: Download Artifacts

        uses: actions/download-artifact@v4

        with:
          name: Runprocess_padv_artifacts


      - name: Download Artifacts

        uses: actions/download-artifact@v4

        with:
          name: Generate_PADV_Report_padv_artifacts


      - name: Upload Artifacts

        if:
          ${{ !cancelled() }}

        uses: actions/upload-artifact@v4

        with:
          name: Collect_Artifacts_padv_artifacts

          path:
            |
            derived/artifacts.dmr
            PA_Results/dcmtrCtrl_PID/webview
            PA_Results/dcmtr_testharness/webview
            PA_Results/test_results

          retention-days:
            30


      - name: Save Cache

        uses: actions/cache@v4

        with:
          key: padv_artifacts-cache-${{ github.sha }}

          path:
            |
            PA_Results/dcmtrCtrl_PID/webview
            PA_Results/dcmtr_testharness/webview
            PA_Results/test_results
            derived/artifacts.dmr